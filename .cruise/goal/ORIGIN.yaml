goal:
  outcome: "Produce and, only after separate Plan approval and Start, execute a low-compute trained hybrid cell-lineage tracker that reaches official grouped local CV, untouched audit, and Kaggle site score of at least 0.92 while projecting final hidden-runtime of at most six hours."
  non_negotiables:
    - "Fine-tune the released official TemporalUNet3D checkpoint; do not train a large model from scratch."
    - "Use physical-coordinate KD-tree candidate gating, a lightweight learned edge/division scorer, and the global constrained lineage solver; do not restore a dense all-pairs transformer association matrix."
    - "Keep the rule-based alpha as teacher, fallback, and regression baseline."
    - "Keep official sparse-label scorer semantics, the submission schema, and truthful separation of local and Kaggle score provenance."
    - "Use hash-grouped near-duplicate splits, grouped three-fold validation, and an untouched stratified 20-video audit."
    - "Use no more than two concurrent paid Kaggle trials, five Kaggle submissions per competition day, and two final selections."
  success_criteria:
    - "Official scorer semantic fixtures and source hashes pass exactly; separately, any local-to-Kaggle transfer model used for decisions meets its preregistered interval-aware out-of-sample bound on frozen calibration pairs."
    - "Grouped three-fold combined score and untouched audit combined score are each at least 0.92 with per-sample node, edge, and division diagnostics."
    - "Router mean regret is at most 0.01 and worst-scenario regret is at most 0.03, with the low-confidence universal fallback tested."
    - "Every emitted graph is valid and covers its dataset."
    - "Public four-clip runtime is at most seven minutes and a measured 199-video/final-workload proxy projects at most six hours."
    - "A qualifying private Kaggle submission completes with displayed site score at least 0.92, and the final manifest records model, fold, package, runtime, score, and spend identities."
  exclusions:
    - "No public model or Kaggle dataset publication, unrelated Kaggle/account actions, credential changes, or destructive git history mutation. Private-repository commits/pushes are permitted; RunPod is per-launch approval-gated."
  permitted_inferences:
    - "The historical alpha local audit is useful as a teacher/fallback baseline but is not Kaggle site evidence."
    - "The released competition model and local alpha components may be composed only within the locked hybrid direction and later Start-time path ownership."
