schema_version: 1
task_id: T-03B
title: "Remote Kaggle kernel generation of full test submission"
status: "approved_active"
related_revision: ".cruise/runs/g01/proposed_revision_remote_generation.md"
revision_sha256: "f1578db9327fdb808eb0ca7450f883731b053c3355683311b78bc1c198dd2e41"
reason: >-
  Cruise worker sandboxes have network disabled, so the Kaggle remote mutation
  must be executed by the coordinator/integration owner with explicit runtime
  approval after the revision is approved. This plan records the exact intended
  external commands and evidence boundaries before any remote action.
inputs:
  package_identity_sha256: "7ed7c9949918cebd777cb4e3e300f89ed320006aa79504909f3f795982540620"
  package_manifest: "reports/kaggle_g01/package_parity_manifest.json"
  kernel_dir: "kaggle_kernel"
  kernel_id: "onebitbrain/biohub-celltrack-alpha"
permissions_required:
  - "D-02 Kaggle account interaction"
  - "D-05 unscored Kaggle kernel remote generation"
external_effects:
  scored_competition_submission: false
  kaggle_kernel_push: true
  kaggle_kernel_run: true
  kaggle_output_download: true
  paid_compute: false
  gpu: false
  internet_enabled_in_kernel: false
commands_after_approval:
  preflight_no_network:
    - "python3 scripts/build_kaggle_kernel.py"
    - ".venv/bin/python -m kaggle --version"
  remote_generation:
    - ".venv/bin/python -m kaggle kernels push -p kaggle_kernel --timeout 43200"
    - ".venv/bin/python -m kaggle kernels status onebitbrain/biohub-celltrack-alpha"
    - ".venv/bin/python -m kaggle kernels output onebitbrain/biohub-celltrack-alpha -p reports/kaggle_g01/kernel_output -o --file-pattern '^submission\\\\.csv$'"
evidence_to_capture:
  - "command, timestamp, exit status, stdout/stderr with secrets redacted"
  - "kernel status/version/result"
  - "downloaded reports/kaggle_g01/kernel_output/submission.csv sha256 and size"
  - "confirmation that no scored competition submission was created by this step"
stop_rules:
  - "Stop on authentication, credential-change, payment, GPU/paid runtime, unrelated account, or quota/rules prompt."
  - "Stop if Kaggle kernel metadata differs from private CPU/no-internet settings before push."
  - "Stop if command output exposes secret values; do not persist the secret-containing output."
next_node:
  on_success: "T-03C local validation of downloaded CSV"
  on_failure: "Record block or one packaging/runtime repair rerun if failure occurs before CSV generation and remains within D-05."
